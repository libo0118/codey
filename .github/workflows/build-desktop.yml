name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: codey-release-automation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_BUILD_DIR: target
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for native desktop tools
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test native Windows MCP protocol
        working-directory: vendor/ComputerUse/windows
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "3.11"
          $expectedHash = "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1"
          $zip = Join-Path $env:RUNNER_TEMP "nsis-$version.zip"
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$version/nsis-$version.zip"
          curl.exe -fL --retry 3 --retry-all-errors -o $zip $url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download NSIS $version"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "NSIS archive hash mismatch. Expected $expectedHash, got $actualHash."
          }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $nsisHome = Join-Path $env:RUNNER_TEMP "nsis-$version"
          $makensis = Join-Path $nsisHome "Bin" "makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe was not found at $makensis"
          }
          "NSISDIR=$nsisHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: JavaScript tests
        run: pnpm run test:js

      - name: Build embedded frontend assets
        run: pnpm run vite:build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --locked
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

      - name: Build Windows executable
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"
          CODEY_UPDATE_BASE_URL: https://github.com/libo0118/codey/releases/latest/download
        run: pnpm run build

      - name: Build Windows installer and update manifest
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version"
          }
          # 更新助手按清单版本校验安装结果，安装包内嵌版本必须一致。
          $cargoMatch = Select-String -Path "Cargo.toml" -Pattern '^\s*version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $cargoMatch) {
            throw "Unable to read the workspace version from Cargo.toml."
          }
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "Cargo.toml version $cargoVersion does not match packaged version $version. Bump the workspace version before releasing."
          }
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          & $env:MAKENSIS /INPUTCHARSET UTF8 "/DVERSION=$version" "/DPROJECT_ROOT=$env:GITHUB_WORKSPACE" scripts/installer/windows/Codey.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist/windows/Codey-$version-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer is missing" }
          node scripts/generate-update-manifest.mjs --version $version --tag "v$version" --download-base-url "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version" --output dist/windows/latest.json $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve release identity
        id: release-metadata
        shell: pwsh
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { releaseIdentity } from "./scripts/release-policy.mjs"; const identity = releaseIdentity(JSON.parse(fs.readFileSync("package.json", "utf8")).version); for (const key of ["name", "tag", "prerelease"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, key + "=" + identity[key] + "\n"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "make_latest=" + identity.makeLatest + "\n");'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codey-windows-x64-installer
          path: dist/windows/*
          if-no-files-found: error

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ steps.release-metadata.outputs.name }}
          tag_name: ${{ steps.release-metadata.outputs.tag }}
          make_latest: ${{ steps.release-metadata.outputs.make_latest }}
          prerelease: ${{ steps.release-metadata.outputs.prerelease == 'true' }}
          files: dist/windows/*
