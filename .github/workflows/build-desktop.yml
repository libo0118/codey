name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: codey-release-automation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_BUILD_DIR: target
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go for native desktop tools
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test native Windows MCP protocol
        working-directory: vendor/ComputerUse/windows
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "3.11"
          $expectedHash = "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1"
          $zip = Join-Path $env:RUNNER_TEMP "nsis-$version.zip"
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$version/nsis-$version.zip"
          curl.exe -fL --retry 3 --retry-all-errors -o $zip $url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download NSIS $version"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "NSIS archive hash mismatch. Expected $expectedHash, got $actualHash."
          }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $nsisHome = Join-Path $env:RUNNER_TEMP "nsis-$version"
          $makensis = Join-Path $nsisHome "Bin" "makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe was not found at $makensis"
          }
          "NSISDIR=$nsisHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: JavaScript tests
        run: pnpm run test:js

      - name: Build embedded frontend assets
        run: pnpm run vite:build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --locked
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

      - name: Build Windows executable
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"
          CODEY_UPDATE_BASE_URL: https://github.com/libo0118/codey/releases/latest/download
        run: pnpm run build

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version"
          }
          # 更新助手按清单版本校验安装结果，安装包内嵌版本必须一致。
          $cargoMatch = Select-String -Path "Cargo.toml" -Pattern '^\s*version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $cargoMatch) {
            throw "Unable to read the workspace version from Cargo.toml."
          }
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "Cargo.toml version $cargoVersion does not match packaged version $version. Bump the workspace version before releasing."
          }
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          & $env:MAKENSIS /INPUTCHARSET UTF8 "/DVERSION=$version" "/DPROJECT_ROOT=$env:GITHUB_WORKSPACE" scripts/installer/windows/Codey.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist/windows/Codey-$version-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer is missing" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codey-windows-x64-installer
          path: dist/windows/*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CODEY_REQUIRE_LINUX_PACKAGING_TOOLS: "1"

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config dpkg-dev rpm cpio

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: linux-el8-x64
          workspaces: ". -> target/linux-el8"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: JavaScript tests
        run: pnpm run test:js

      - name: Build embedded frontend assets
        run: pnpm run vite:build

      - name: Build EL8 x64 toolchain image
        run: docker build --platform linux/amd64 --tag codey-linux-x64-builder scripts/installer/linux

      - name: Check and build Linux executables on glibc 2.28
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"
          CODEY_UPDATE_BASE_URL: https://github.com/libo0118/codey/releases/latest/download
        run: |
          node_home=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$HOME/.cargo:/opt/cargo" --volume "$HOME/.rustup:/opt/rustup:ro" \
            --volume "$node_home:/opt/node:ro" \
            --env HOME=/tmp/codey-build-home --env CARGO_HOME=/opt/cargo --env RUSTUP_HOME=/opt/rustup \
            --env PATH=/opt/node/bin:/opt/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CARGO_TARGET_DIR=target/linux-el8 --env CARGO_BUILD_BUILD_DIR=target/linux-el8/build \
            --env RUSTFLAGS --env CARGO_TERM_COLOR --env CARGO_PROFILE_RELEASE_LTO --env CARGO_PROFILE_RELEASE_CODEGEN_UNITS \
            --env CODEY_SKIP_OVERLAY_BUILD --env CODEY_UPDATE_BASE_URL \
            codey-linux-x64-builder bash -euo pipefail -c '
              mkdir -p "$HOME"
              cargo fmt --all -- --check
              cargo test --workspace --locked
              cargo clippy --workspace --all-targets --locked -- -D warnings
              node scripts/build.mjs
              mkdir -p target/release
              for binary in codey codey-fastctx; do
                dependencies=$(ldd "target/linux-el8/release/$binary")
                printf "%s\n" "$dependencies"
                if grep -q "not found" <<< "$dependencies"; then exit 1; fi
                cp "target/linux-el8/release/$binary" "target/release/$binary"
              done
            '

      - name: Package and verify Linux tar, Debian, and RPM packages
        run: node scripts/package-linux.mjs

      - name: Verify Debian 11 package installation and removal
        run: |
          version=$(node -p "require('./package.json').version")
          docker run --rm --platform linux/amd64 --volume "$PWD/dist/linux:/packages:ro" \
            --env CODEY_VERSION="$version" debian:11 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends "/packages/Codey-$CODEY_VERSION-linux-x64.deb"
              test "$(command -v codey)" = /usr/bin/codey
              test -x /usr/lib/codey/codey
              test -x /usr/lib/codey/codey-fastctx
              test -f /usr/share/applications/codey.desktop
              mkdir -p "$HOME/.codey"
              printf preserved > "$HOME/.codey/package-removal-test"
              dpkg --remove codey
              test ! -e /usr/bin/codey
              test "$(cat "$HOME/.codey/package-removal-test")" = preserved
            '

      - name: Verify EL8 RPM installation and removal
        run: |
          version=$(node -p "require('./package.json').version")
          docker run --rm --platform linux/amd64 --volume "$PWD/dist/linux:/packages:ro" \
            --env CODEY_VERSION="$version" registry.access.redhat.com/ubi8/ubi:8.10 bash -euo pipefail -c '
              dnf install -y "/packages/Codey-$CODEY_VERSION-linux-x64.rpm"
              test "$(command -v codey)" = /usr/bin/codey
              test -x /usr/lib/codey/codey
              test -x /usr/lib/codey/codey-fastctx
              test -f /usr/share/applications/codey.desktop
              mkdir -p "$HOME/.codey"
              printf preserved > "$HOME/.codey/package-removal-test"
              rpm --erase codey
              test ! -e /usr/bin/codey
              test "$(cat "$HOME/.codey/package-removal-test")" = preserved
            '

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: codey-linux-x64-package
          path: |
            dist/linux/*-linux-x64.tar.gz
            dist/linux/*-linux-x64.deb
            dist/linux/*-linux-x64.rpm
          if-no-files-found: error

  release:
    name: Assemble packages and release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: codey-windows-x64-installer
          path: release-assets

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: codey-linux-x64-package
          path: release-assets

      - name: Resolve release identity
        id: release-metadata
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { releaseIdentity } from "./scripts/release-policy.mjs"; import { readSourceVersion } from "./scripts/prepare-release-version.mjs"; const identity = releaseIdentity(await readSourceVersion()); if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== identity.tag) throw new Error("Release tag must match package.json version"); for (const key of ["name", "tag", "prerelease"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, key + "=" + identity[key] + "\n"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "make_latest=" + identity.makeLatest + "\n");'

      - name: Generate unified update manifest
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/generate-update-manifest.mjs --version "$version" --tag "v$version" --download-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version" --output release-assets/latest.json "release-assets/Codey-$version-windows-x64-setup.exe" "release-assets/Codey-$version-linux-x64.tar.gz" "release-assets/Codey-$version-linux-x64.deb" "release-assets/Codey-$version-linux-x64.rpm"

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: codey-update-manifest
          path: release-assets/latest.json
          if-no-files-found: error

      - name: Publish desktop release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ steps.release-metadata.outputs.name }}
          tag_name: ${{ steps.release-metadata.outputs.tag }}
          make_latest: ${{ steps.release-metadata.outputs.make_latest }}
          prerelease: ${{ steps.release-metadata.outputs.prerelease == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true
